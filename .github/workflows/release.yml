name: release

# Builds the wheel and sdist with the page (web/dist) inside, so installing them needs no Node.
# A tag v<version> attaches them to a GitHub release and publishes them to PyPI (agora-canvas) through trusted
# publishing: PyPI trusts this workflow in the environment `pypi`, no token is stored. A manual run only keeps them
# as a workflow artifact. The tag must match `version` in pyproject.toml (PyPI never takes a version twice).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml)
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME does not match version $v in pyproject.toml"; exit 1; }
      # hatch_build.py runs `npm ci` and `npm run build` in web/ when web/dist is missing
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/agora-canvas/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
