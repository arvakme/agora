name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    # Excalidraw workbench frontend: typecheck, lint, unit tests, build, vendored-asset check, eval replay.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npx vitest run
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm run libraries:fetch -- --check
      # Offline eval replay: re-applies the committed model outputs in eval/runs/ through
      # the real validate → apply → check → undo path in headless Chromium. No model calls.
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run eval:replay

  site:
    # The homepage in site/: a PR that breaks its build fails here, not after merge in pages.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npm run build
