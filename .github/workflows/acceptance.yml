name: acceptance

# The trusted publisher for the `acceptance` check. It runs only by hand from
# the default branch, so pull request code never executes with the repository
# token, and it only ever publishes against the pull request's live head SHA.

on:
  workflow_dispatch:
    inputs:
      evidence:
        description: >-
          JSON: {"pr", "head_sha", "moderator", "review": {"author", "reviewer",
          "verdict", "summary"}, "verification": [{"command", "exit_code",
          "commit"}], "browser": {"status", "reason", "commit"}}
        required: true
        type: string

permissions:
  checks: write
  pull-requests: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse to publish from a non-default branch
        run: |
          test "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}"
      - uses: actions/checkout@v4
      - run: python3 .github/workflows/acceptance/gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCEPTANCE_EVIDENCE: ${{ inputs.evidence }}
