<!doctype html>

  一张拍子网格：120 BPM，B(n) = 第 n 拍的秒数；画面切点、文字、音效和配乐的 !mark! 都落在这张网格上。
-->
<html lang="zh-CN" data-composition-variables='[
  {"id":"repo","type":"string","label":"仓库地址","default":"github.com/arvakme/agora"},

  {"id":"open","type":"string","label":"打开命令","default":"cd my-service && agora"},
  {"id":"accent","type":"color","label":"强调色（Agora 界面的紫）","default":"#7048b4"},
  {"id":"paper","type":"color","label":"纸色（README 示意图）","default":"#f7f4ee"},
  {"id":"ink","type":"color","label":"墨色","default":"#2b2926"}
]'>

<style id="om-fonts">

<style>

  .corner::after { top: 10px; left: 0; height: 1.5px; width: 22px; }
  .layer { position: absolute; inset: 0; }
  svg { overflow: visible; }

  /* 文字 */
  .big { position: absolute; left: 0; right: 0; text-align: center; font-family: "Noto Sans SC", "Inter", sans-serif; font-weight: 900; letter-spacing: -2px; }

  .cap { position: absolute; left: 0; right: 0; top: 958px; height: 90px; text-align: center; font-family: "Noto Sans SC", "Inter", sans-serif;

  .cap .mask { padding-bottom: .1em; }
  .chip { display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 28px; margin: 0 10px; border-radius: 32px; background: #fff;
    border: 1.5px solid #d9d2c5; font-family: "Inter", sans-serif; font-weight: 650; font-size: 34px; vertical-align: middle; line-height: 64px; }

  .label { display: inline-flex; align-items: center; gap: 14px; height: 70px; padding: 0 30px; border-radius: 14px; background: var(--ink); color: #fff;
    font-family: "Noto Sans SC", "Inter", sans-serif; font-weight: 700; font-size: 38px; line-height: 70px; }

  /* 实录卡片：与录屏同为 1.6:1 */
  .shot { position: absolute; left: 240px; top: 36px; width: 1440px; height: 900px; border-radius: 18px; overflow: hidden; background: #fff;

  .shot video, .shot img { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; object-fit: cover; }
  .shot img.contain { object-fit: contain; background: var(--paper); }

  #term .ln .p { color: #bea5f5; }
  #term .ln .c { color: #8b857a; }
  #term .caret { display: inline-block; width: 18px; height: 38px; background: #bea5f5; vertical-align: -6px; margin-left: 2px; }

  /* 结尾 */
  #banner { position: absolute; left: 0; top: 0; width: 3240px; height: 1080px; }
  #endShade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,6,20,0) 45%, rgba(8,6,20,.62) 78%, rgba(8,6,20,.78) 100%); }
  .wordmark { position: absolute; left: 0; right: 0; top: 640px; text-align: center; color: #fff; font-family: "Inter", sans-serif; font-weight: 800;
    font-size: 170px; letter-spacing: -6px; line-height: 1.2; }
  .wordmark .mask { padding: 0 .1em .12em; }
  .endsub { position: absolute; left: 0; right: 0; top: 842px; text-align: center; color: #f2e6d4; font-family: "Noto Sans SC", sans-serif; font-weight: 500; font-size: 42px; }
  .endurl { position: absolute; left: 0; right: 0; top: 926px; text-align: center; color: #d6c6fa; font-family: "Agora Mono", monospace; font-size: 36px; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>

<script>
  window.__timelines = window.__timelines || {};
  const V = OM.vars();
  OM.music({ bpm: 120 });
  const B = (n) => OM.beat(n);          // 第 n 拍（从 0 起）的秒数：B(2) = 1.0 s
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
  const $ = (s) => document.querySelector(s);
  const show = (el, at) => tl.set(el, { visibility: 'visible' }, at);
  const hide = (el, at) => tl.set(el, { visibility: 'hidden' }, at);
  const rise = (sel, at, dur = 0.55) => tl.fromTo(sel, { yPercent: 140 }, { yPercent: 0, duration: dur, ease: 'expo.out', immediateRender: false }, at);
  const sink = (sel, at, dur = 0.3) => tl.to(sel, { yPercent: -140, duration: dur, ease: 'power3.in' }, at);
  gsap.set(['.cap .mask > span', '.big .mask > span', '.wordmark .mask > span'], { yPercent: 140 });
  gsap.set(['#c4 .chip', '#cM .label', '#es', '#eu'], { opacity: 0 });

  // 一个字一个 span，按时间点亮（打字；纯时间函数，跳到哪一帧都一样）
  function typeInto(el, text, at, cps, cls) {
    const chars = [...text];
    el.insertAdjacentHTML('beforeend', chars.map((c) => `<span class="${cls || ''}" style="visibility:hidden">${c === ' ' ? ' ' : c.replace('&', '&amp;')}</span>`).join(''));
    const spans = [...el.querySelectorAll('span')].slice(-chars.length);
    spans.forEach((s, i) => tl.set(s, { visibility: 'visible' }, at + i / cps));
    return at + chars.length / cps;
  }
  function stroke(sel, at, dur, ease = 'power2.inOut') {
    document.querySelectorAll(sel).forEach((p) => {
      const L = p.getTotalLength();
      gsap.set(p, { strokeDasharray: L, strokeDashoffset: L });
      tl.to(p, { strokeDashoffset: 0, duration: dur, ease }, at);
    });
  }
  // 小人走路：腿和身体随步子摆（重复的补间也是时间的函数）
  function walk(target, legs, from, to, at, dur) {
    tl.fromTo(target, { x: from[0], y: from[1] }, { x: to[0], y: to[1], duration: dur, ease: 'power1.inOut', immediateRender: false }, at);
    const steps = Math.round(dur / 0.25);
    tl.to(legs[0], { rotation: 16, svgOrigin: '0 -40', duration: 0.125, yoyo: true, repeat: steps * 2 - 1, ease: 'sine.inOut' }, at);
    tl.to(legs[1], { rotation: -16, svgOrigin: '0 -40', duration: 0.125, yoyo: true, repeat: steps * 2 - 1, ease: 'sine.inOut' }, at);
  }

  // ---------- hook 0–4 s ----------
  tl.addLabel('scene:hook', 0);
  const f1 = $('#f1');
  f1.innerHTML = '<span class="caret" style="display:inline-block;width:6px;height:96px;background:var(--accent);vertical-align:-14px;margin-left:8px"></span>';
  const f1t = document.createElement('span'); f1.prepend(f1t);
  gsap.set('#nA', { strokeDasharray: $('#nA').getTotalLength(), strokeDashoffset: $('#nA').getTotalLength() });
  // 小人从左边走上来，站到一条线上（线 = 未来节点的上沿）
  walk('#fig', ['#legL', '#legR'], [520, 560], [880, 560], 0, 1.5);
  tl.fromTo('#hook', { scale: 1.08 }, { scale: 1, duration: 3.55, ease: 'power1.out', immediateRender: false }, 0);
  tl.fromTo('#nA', { strokeDashoffset: $('#nA').getTotalLength() }, { strokeDashoffset: $('#nA').getTotalLength() * 0.72, duration: 1.5, ease: 'power1.inOut', immediateRender: false }, 0);
  typeInto(f1t, '说一句话', B(1), 9);
  OM.sfx('type', B(1), { dur: 0.45, gain: 0.5 });
  tl.set('#figLaptop', { opacity: 1 }, B(3));
  tl.to('#armR', { rotation: -8, svgOrigin: '0 -64', duration: 0.12, yoyo: true, repeat: 7 }, B(3));
  // 第 2 小节：句子换成第二句，节点框画完，左右又长出两个节点和箭头
  tl.to('#f1', { yPercent: -60, opacity: 0, duration: 0.3, ease: 'power3.in' }, B(4) - 0.3);
  rise('#f2 .mask > span', B(4));
  tl.to('#nA', { strokeDashoffset: 0, duration: 0.5, ease: 'power2.out' }, B(4));
  OM.sfx('draw', B(4), { dur: 0.5, gain: 0.5 });
  stroke('#nB', B(5), 0.4, 'power2.out'); stroke('#aB, #aBh', B(5) + 0.2, 0.25, 'power2.out');
  stroke('#nC', B(6), 0.4, 'power2.out'); stroke('#aC, #aCh', B(6) + 0.2, 0.25, 'power2.out');
  OM.sfx('pop', B(5), { note: 1, gain: 0.4, pan: -0.4 }); OM.sfx('pop', B(6), { note: 3, gain: 0.4, pan: 0.4 });
  // 4.0 s 切点前：中间的节点冲向镜头，变成录屏窗口
  tl.to('#hookSvg', { scale: 3.2, transformOrigin: '960px 640px', duration: 0.45, ease: 'power3.in' }, B(8) - 0.45);
  tl.to('#f2', { opacity: 0, duration: 0.2 }, B(8) - 0.3);
  hide('#hook', B(8));

  // ---------- draw 4–10 s ----------
  tl.addLabel('scene:draw', B(8));
  show('#sReveal', B(8));
  tl.fromTo('#sReveal', { scale: 0.86 }, { scale: 1, duration: 0.6, ease: 'expo.out', immediateRender: false }, B(8));
  tl.fromTo('#iReveal', { scale: 1 }, { scale: 1.12, duration: 3.7, ease: 'none', immediateRender: false }, B(8));
  show('#c3', B(10)); rise('#c3 .mask > span', B(10));
  // 8.0 s 推近到小人画画的地方（录屏右下角）
  tl.fromTo('#iReveal', { scale: 1.12, xPercent: 0, yPercent: 0 }, { scale: 1.7, xPercent: -18, yPercent: -16, duration: 0.6, ease: 'expo.inOut', immediateRender: false }, B(16) - 0.3);
  sink('#c3 .mask > span', B(19) - 0.3); hide('#c3', B(19));
  hide('#sReveal', B(20));

  // ---------- agents 10–14 s ----------
  tl.addLabel('scene:agents', B(20));
  show('#sHop', B(20));
  tl.fromTo('#iHop', { scale: 1.08 }, { scale: 1, duration: 4, ease: 'power1.out', immediateRender: false }, B(20));
  show('#c4', B(20)); hide('#c4', B(24));
  document.querySelectorAll('#c4 .chip').forEach((c, i) => {
    tl.fromTo(c, { opacity: 0, y: 26, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.6)', immediateRender: false }, B(20 + i));
  });
  tl.to('#c4 .chip', { opacity: 0, y: -20, duration: 0.25, stagger: 0.04, ease: 'power2.in' }, B(24) - 0.3);
  show('#c5', B(24)); rise('#c5 .mask > span', B(24));
  sink('#c5 .mask > span', B(28) - 0.3); hide('#c5', B(28));
  hide('#sHop', B(28));

  // ---------- build / stop 14–16 s ----------
  tl.addLabel('scene:build', B(28));
  show('#nest', B(28));
  tl.fromTo('#f6 .mask > span', { yPercent: 140 }, { yPercent: 0, duration: 0.32, ease: 'power4.out', immediateRender: false }, B(28));
  OM.sfx('thud', B(28) + 0.12, { gain: 0.6 });
  gsap.set('#nestBox', { opacity: 0 });
  tl.fromTo('#nestBox', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out', immediateRender: false }, B(29));
  tl.fromTo('#innerBoxes', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, B(29) + 0.2);
  tl.addLabel('scene:stop', B(30));
  // 停住一拍，再被吸进节点里
  tl.to('#f6', { opacity: 0, y: -40, duration: 0.3, ease: 'power2.in' }, B(31));
  tl.to('#nestBox', { scale: 6, duration: 0.5, ease: 'power4.in' }, B(32) - 0.5);
  hide('#nest', B(32));

  // ---------- drop 16–20 s ----------
  tl.addLabel('scene:drop', B(32));
  show('#sWheel', B(32));
  tl.fromTo('#sWheel', { scale: 1.12 }, { scale: 1, duration: 0.5, ease: 'expo.out', immediateRender: false }, B(32));
  show('#c7', B(34)); rise('#c7 .mask > span', B(34));
  hide('#sWheel', B(37)); show('#sFly', B(37));
  OM.sfx('whoosh', B(37), { gain: 0.35 });
  sink('#c7 .mask > span', B(40) - 0.3); hide('#c7', B(40));
  hide('#sFly', B(40));

  // ---------- burst 20–24 s：一拍一刀，标签钉在原处换字 ----------
  tl.addLabel('scene:burst', B(40));
  const labels = ['素材库：约 6k 个组件', '几个 agent 同时干活', '进度指针', '轨迹逐步可查', '一键回到终端', '分享给别人看', '访客只读，可以评论', '沿箭头滑过去'];
  const mText = $('#mText');
  show('#cM', B(40)); tl.set('#cM .label', { opacity: 1 }, B(40));
  labels.forEach((txt, i) => {
    const t = B(40 + i);
    show('#m' + i, t);
    if (i) hide('#m' + (i - 1), t);
    tl.fromTo('#m' + i + ' .inner', { scale: 1.14 }, { scale: 1.02, duration: B(1), ease: 'none', immediateRender: false }, t);
    tl.set(mText, { textContent: txt }, t);
    tl.fromTo('#cM .label', { scale: 1.06 }, { scale: 1, duration: 0.2, ease: 'power2.out', immediateRender: false }, t);
    OM.sfx('hit', t, { gain: 0.42, pitch: 1 + i * 0.05, pan: (i % 2 ? 0.25 : -0.25) });
  });
  hide('#m7', B(48));
  hide('#cM', B(48));

  // ---------- mech 24–28 s ----------
  tl.addLabel('scene:mech', B(48));
  show('#mech', B(48));
  tl.set('#flow', { clipPath: 'inset(0% 66% 0% 0% round 22px)' }, B(48));
  tl.set('#flow', { clipPath: 'inset(0% 34% 0% 0% round 22px)' }, B(49));
  tl.set('#flow', { clipPath: 'inset(0% 0% 0% 0% round 22px)' }, B(50));
  tl.fromTo('#flow', { scale: 0.97 }, { scale: 1, duration: 0.8, ease: 'expo.out', immediateRender: false }, B(48));
  tl.fromTo('#mech', { scale: 1, y: 0 }, { scale: 1.1, y: -30, duration: 4, ease: 'power1.inOut', immediateRender: false }, B(48));
  // 数据包：终端 → 服务 → 画布，沿两段虚线跑（坐标 = 示意图坐标 × 1720/1520，再加偏移）
  const k = 1720 / 1520, fx = (x) => 100 + (x - 40) * k - 13, fy = (y) => 180 + (y - 80) * k - 13;
  gsap.set('#packet', { x: fx(445), y: fy(300), opacity: 0 });
  tl.set('#packet', { opacity: 1 }, B(51));
  tl.fromTo('#packet', { x: fx(445) }, { x: fx(655), duration: 0.5, ease: 'power2.inOut', immediateRender: false }, B(51));
  tl.to('#packet', { x: fx(905), duration: 0.3, ease: 'none' }, B(52));
  tl.to('#packet', { x: fx(1105), duration: 0.5, ease: 'power2.inOut' }, B(52) + 0.3);
  tl.to('#packet', { opacity: 0, duration: 0.15 }, B(53) + 0.4);
  tl.set('#packet', { x: fx(445), opacity: 1 }, B(54));
  tl.to('#packet', { x: fx(1105), duration: 1.2, ease: 'power1.inOut' }, B(54));
  tl.to('#packet', { opacity: 0, duration: 0.15 }, B(54) + 1.2);
  OM.sfx('tick', B(51), { gain: 0.35 }); OM.sfx('tick', B(53), { gain: 0.35 });
  show('#c8', B(52)); rise('#c8 .mask > span', B(52));
  sink('#c8 .mask > span', B(56) - 0.3);
  hide('#mech', B(56));

  // ---------- install 28–32 s ----------
  tl.addLabel('scene:install', B(56));
  show('#inst', B(56));
  tl.fromTo('#term', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out', immediateRender: false }, B(56));
  tl.fromTo('#inst', { scale: 1 }, { scale: 1.07, duration: 4, ease: 'power1.inOut', immediateRender: false }, B(56));
  tl.fromTo('#fig2', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, B(56) + 0.1);
  $('#t1').innerHTML = '<span class="p">$ </span>';
  $('#t2').innerHTML = '<span class="p">$ </span>';
  gsap.set('#t2, #t3', { opacity: 0 });
  const e1 = typeInto($('#t1'), V.install, B(56) + 0.1, 33);
  OM.sfx('type', B(56) + 0.1, { dur: e1 - B(56) - 0.1, gain: 0.45 });
  tl.set('#t2', { opacity: 1 }, B(60));
  const e2 = typeInto($('#t2'), V.open, B(60), 30);
  OM.sfx('type', B(60), { dur: e2 - B(60), gain: 0.45 });
  tl.fromTo('#t3', { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, B(62));
  tl.to('#fig2Arm', { rotation: -10, svgOrigin: '0 -64', duration: 0.1, yoyo: true, repeat: 29 }, B(56) + 0.1);
  hide('#inst', B(64));

  // ---------- logo 32–40 s ----------
  tl.addLabel('scene:logo', B(64));
  show('#end', B(64));
  OM.sfx('hit', B(64), { gain: 0.5 });
  tl.fromTo('#banner', { x: -420, scale: 1.04 }, { x: -900, scale: 1, duration: 8, ease: 'none', immediateRender: false }, B(64));
  rise('#wm .mask > span', B(66), 0.7);
  tl.fromTo('#es', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, immediateRender: false }, B(68));
  tl.fromTo('#eu', { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, immediateRender: false }, B(70));
  OM.sfx('tick', B(70), { gain: 0.3 });
  tl.to('#fade', { opacity: 1, duration: 1.0, ease: 'power1.in' }, B(78));
  tl.to({}, { duration: 0 }, B(80));

  window.__timelines['film'] = tl;
</script>
