[project]
name = "agora-canvas"  # "agora" and "agora-cli" are taken on PyPI; the command stays `agora`
version = "0.2.0"  # 0.1.0 is on PyPI already (uploaded by hand, 2026-10-19)
description = "One Agora per project: an architecture canvas shared with your own coding agent"
dynamic = ["readme"]  # README.md with its relative links made absolute for PyPI (fancy-pypi-readme below)
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "web/libraries/NOTICE.md", "web/libraries/licenses/*"]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
]

[project.scripts]
agora = "agora_cli.main:main"  # the generated launcher calls sys.exit(main()): exit codes pass through

[project.urls]
Homepage = "https://arvakme.github.io/agora/"
Repository = "https://github.com/arvakme/agora"
Changelog = "https://github.com/arvakme/agora/releases"

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agora_cli", "server", "native_protocol.py"]

[tool.hatch.build.targets.sdist]
only-include = ["agora_cli", "server", "native_protocol.py", "hatch_build.py", "bin", "skills", "web", "README.md", "LICENSE"]
# web sources stay (a wheel built from the sdist without the page can still build it); test evidence and evals do not
exclude = ["web/evidence", "web/eval", "web/docs", "web/node_modules"]

# PyPI shows README.md without the repository around it: images point at raw files, other links at GitHub
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")(?!https?://|#|mailto:)([^)"]+\.(?:png|gif|svg|webp|jpg|jpeg))'
replacement = '\1https://raw.githubusercontent.com/arvakme/agora/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|href=")(?!https?://|#|mailto:)([^)"]+)'
replacement = '\1https://github.com/arvakme/agora/blob/main/\2'

# hatch_build.py: puts web/dist, web/libraries, web/generated, skills and bin/ into the wheel under server/_bundle
[tool.hatch.build.hooks.custom]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 200
extend-exclude = ["web/node_modules", "site/node_modules", "tests/legacy"]  # tests/legacy: frozen implementations the adapters are checked against

[tool.ruff.lint]
# pyflakes and syntax-level errors only: the code has its own layout (one-line lambdas, short names in geometry)
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported and then named as test arguments
"tests/**" = ["F811"]
